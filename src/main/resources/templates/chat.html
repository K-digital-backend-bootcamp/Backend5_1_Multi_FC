<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MULTI FC - 실시간 채팅</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        .quick-menu {
            height: 70px;         /* 실제 헤더 높이에 맞추기 */
        }
        /* [기존 스타일 유지] */
        .chat-main {
            padding-top: 70px;
            display: flex;
            min-height: calc(100vh - 70px);
            background-color: #f7f7f7;
            position: relative;
            overflow-x: hidden;
            transition: all 0.3s ease-in-out;
        }
        .chat-sidebar {
            width: 300px;
            background: white;
            border-right: 1px solid #ddd;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
        .chat-content-area {
            flex-grow: 1;
            background: #fff;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: all 0.3s ease-in-out;
            min-width: 0;
            height: calc(100vh - 70px); /* Force full viewport height minus header */
            max-height: calc(100vh - 70px);
        }

        /* 핵심 CSS: 사이드바가 열릴 때 메인 콘텐츠를 밀어냅니다. */
        .chat-main.sidebar-open {
            margin-right: 280px;
        }

        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: 700;
            color: #2c3e50;
        }

        /* ★채팅 유형 탭 버튼 스타일 (깔끔한 글씨 밑줄 형식)★ */
        .chat-type-tabs {
            display: flex;
            justify-content: space-around;
            padding: 10px 0 0 0;
            margin-bottom: 0;
            border-bottom: 1px solid #eee;
        }
        .chat-type-tabs button {
            flex-grow: 1;
            padding: 10px 5px;
            margin: 0;
            background: none !important;
            border: none !important;
            border-radius: 0 !important;
            font-size: 14px;
            font-weight: 600;
            color: #999;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            outline: none;
        }
        .chat-type-tabs button.active {
            color: #6c5ce7;
            border-bottom-color: #6c5ce7;
        }
        .chat-type-tabs button:hover:not(.active) {
            color: #2c3e50;
            background-color: transparent;
        }


        /* 채팅방 목록 */
        .room-list-container {
            flex-grow: 1;
            overflow-y: auto;
        }
        .room-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 10px 15px 20px;
            border-bottom: 1px solid #f7f7f7;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .room-item:hover, .room-item.active {
            background-color: #f0f0f0;
        }
        .room-info {
            flex-grow: 1;
            min-width: 0;
            padding-right: 10px;
        }
        .room-name {
            font-weight: 600;
            color: #2c3e50;
        }
        .last-message {
            font-size: 13px;
            color: #888;
            margin-top: 4px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* 삭제 버튼 스타일 */
        .delete-room-btn {
            background: none;
            border: none;
            color: #e74c3c;
            font-size: 15px;
            cursor: pointer;
            flex-shrink: 0;
            opacity: 0.7;
            padding: 5px;
        }
        .delete-room-btn:hover {
            opacity: 1;
        }

        /* 채팅방 상세 */
        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            background-color: #f7f7f7;
            scrollbar-width: none;
            height: 0;
            min-height: 0;
        }
        .chat-messages::-webkit-scrollbar {
            display: none;                /* Chrome, Edge, Safari */
        }
        .chat-input-area {
            border-top: 1px solid #ddd;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            background: white;
            flex-shrink: 0;
        }
        .chat-input-area input {
            flex-grow: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 20px;
            margin-right: 10px;
            font-size: 15px;
        }
        .chat-input-area button {
            background-color: #6c5ce7;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .chat-input-area button:hover {
            background-color: #8e44ad;
        }
        /* 각 메시지 묶음 */
        .message-wrapper {
            margin: 12px 0;
            display: flex;
            flex-direction: column;
        }

        /* 정렬 */
        .message-wrapper.other {
            align-items: flex-start;
        }

        .message-wrapper.mine {
            align-items: flex-end;
        }

        /* 닉네임 */
        .message-nickname {
            font-size: 13px;
            color: #444;
            margin-bottom: 3px;
            margin-left: 4px;
            font-weight: 600;
        }

        /* 말풍선 + 시간 행 */
        .bubble-row {
            display: flex;
            align-items: flex-end;
            gap: 6px;
        }

        .bubble-row.other {
            justify-content: flex-start;
        }

        .bubble-row.mine {
            justify-content: flex-end;
        }

        /* 말풍선 스타일 */
        .message-bubble {
            max-width: 250px;
            padding: 9px 12px;
            border-radius: 18px;
            line-height: 1.4;
            font-size: 14px;
            word-break: break-word;
        }

        /* 상대 말풍선 */
        .message-bubble.other {
            background: #ffffff;
            border: 1px solid #ddd;
            color: #222;
        }

        /* 내 말풍선 (카톡 블루 계열) */
        .message-bubble.mine {
            background: #d2e4fc;
            color: #111;
        }

        /* 시간 */
        .message-time {
            font-size: 11px;
            color: #777;
            margin-bottom: 15px;
        }

        .message-text {
            padding: 10px 15px;
            max-width: 70%;
            word-wrap: break-word;
            font-size: 15px;
        }
        .message-meta {
            font-size: 11px;
            color: #888;
            align-self: flex-end;
            margin: 0 5px;
        }

        /* 룸이 선택되지 않았을 때 */
        #chat-welcome-message {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: #999;
            height: 100%;
            text-align: center;
        }
        #current-chat-room {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden; /* 인라인 프로필이 벗어나지 않도록 */
        }

        /* 상태 메시지 */
        #connection-status {
            position: absolute;
            top: 70px;
            left: 0;
            width: 100%;
            background-color: #f0f0f0;
            color: #e74c3c;
            padding: 8px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            z-index: 990;
            display: none;
        }

        /* ★참여자 목록 사이드바 스타일★ */
        #participant-sidebar {
            position: fixed;
            top: 70px;
            right: 0;
            width: 280px;
            height: calc(100vh - 70px);
            background: white;
            box-shadow: -4px 0 10px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #ddd;
        }
        #participant-sidebar.open {
            transform: translateX(0);
        }
        .sidebar-header {
            padding: 15px 20px;
            font-size: 18px;
            font-weight: 700;
            color: #2c3e50;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar-close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #555;
        }
        .participant-list-container {
            flex-grow: 1;
            padding: 10px 0;
        }

        /* 참여자 항목 스타일 개선 */
        .participant-item {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            border-bottom: 1px solid #f7f7f7;
            cursor: pointer;
        }
        .participant-item:hover {
            background-color: #fcfcfc;
        }
        .participant-icon-wrapper {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 10px;
            flex-shrink: 0;
        }
        .participant-icon-wrapper i {
            font-size: 16px;
            color: #6c5ce7;
            margin: 0;
        }
        .participant-details {
            display: flex;
            flex-direction: column;
            line-height: 1.3;
        }
        .participant-name {
            font-size: 15px;
            color: #333;
            font-weight: 500;
        }
        .participant-role-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 5px;
            margin-left: 5px;
            color: white;
            white-space: nowrap;
        }
        .role-admin { background-color: #6c5ce7; }
        .role-host { background-color: #e74c3c; }
        .role-me { background-color: #3498db; }

        /* 모바일 대응 */
        @media (max-width: 900px) {
            .chat-main.sidebar-open {
                width: 100%;
                margin-right: 0;
            }
            #participant-sidebar {
                width: 100%;
                height: calc(100vh - 70px);
            }
        }

        /* ★모달 스타일★ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10001;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 90%;
            transform: translateY(-20px);
            transition: transform 0.3s;
            position: relative;
        }
        .modal-overlay.open .modal-content {
            transform: translateY(0);
        }
        .modal-content h2 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 20px;
            border-bottom: 2px solid #6c5ce7;
            padding-bottom: 10px;
        }
        .modal-content p {
            font-size: 15px;
            color: #555;
            margin-bottom: 10px;
        }
        .modal-content strong {
            color: #6c5ce7;
            margin-left: 5px;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        .modal-actions button {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-cancel {
            background: #f0f0f0;
            color: #555;
            border: 1px solid #ddd;
        }
        .btn-create {
            background: #6c5ce7;
            color: white;
            border: none;
        }

        /* 새 채팅 모달 전용 입력 필드 스타일 */
        #new-chat-modal .modal-content input,
        #new-chat-modal .modal-content select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
            font-size: 15px;
        }

        /* ★친구 초대 모달 목록 스타일 */
        .invite-friend-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #f7f7f7;
            cursor: pointer;
        }
        .invite-friend-item:hover {
            background-color: #fafafa;
        }
        .invite-friend-item.selected {
            background-color: #e6e6ff; /* 연한 보라색 배경 */
        }
        .invite-friend-item span {
            font-size: 15px;
            color: #333;
        }
        .friend-status {
            font-size: 12px;
            color: #28a745; /* 온라인 색상 */
            margin-left: 10px;
        }
        .friend-status.offline {
            color: #999;
        }
        .friend-checkbox {
            transform: scale(1.2);
            accent-color: #6c5ce7;
        }

        /* ★초대 모달 내 버튼 */
        #invite-modal .modal-content button {
            padding: 5px 15px;
            border-radius: 5px;
            font-weight: 600;
        }
        #final-invite-btn:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }

        /* ★★★ 최종 수정: 인라인 프로필 상세 정보 스타일 (버그 해결 및 UI 확정) ★★★ */
        .inline-profile-detail {
            /* ⭐⭐⭐ 위치 조정: FIXED + 우측 참여자 사이드바 옆에 나오도록 ⭐⭐⭐ */
            position: fixed;
            top: 100px;
            right: 280px; /* 참여자 사이드바 너비만큼 왼쪽으로 띄우기 (280px) */
            width: 200px; /* 창 크기 조정 */
            height: auto;
            background: white;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 15px;

            /* ⭐⭐⭐ 초기 숨김 상태 (JS에서 display:none 제어) ⭐⭐⭐ */
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
            display: none; /* ⭐⭐ 초기 렌더링 시 아예 숨김 ⭐⭐ */
            flex-direction: column;
            z-index: 9999;
            border: 1px solid #ddd;
        }

        /* 창이 열렸을 때 (현재 위치(right: 280px)로 이동) */
        .inline-profile-detail.open {
            transform: translateX(0%); /* X축 이동 0% = right: 280px 위치에 표시 */
            display: flex; /* ⭐⭐ 열릴 때만 보이게 설정 ⭐⭐ */
        }

        .inline-profile-detail .close-profile-btn {
            position: absolute;
            top: 5px;
            right: 10px;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #555;
        }
        .profile-detail-img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 8px;
            border: 2px solid #6c5ce7;
        }
        .profile-info-content h3 {
            font-size: 16px;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        .profile-meta-info p {
            font-size: 12px;
            color: #555;
            margin-bottom: 4px;
        }
        .profile-meta-info strong {
            font-size: 13px;
        }
        .chat-one-on-one-btn, .send-friend-request-btn {
            padding: 8px 10px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            font-size: 13px;
        }
        /* 프로필 상세 창이 열렸을 때 메시지 영역을 밀어냅니다. (fixed position이라 필요 없음) */
        .chat-content-area.profile-open {
            padding-left: 0;
        }
        /* ⭐⭐ 보강: 채팅방 상세 정보 (인원/유형) 헤더 스타일 ⭐⭐ */
        .room-title-wrapper {
            display: flex;
            align-items: center;
        }
        .room-status-info {
            font-size: 13px;
            font-weight: 500;
            color: #6c5ce7;
            margin-left: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .room-status-info .fa-lock { color: #e74c3c; } /* 1:1 채팅 아이콘 색상 */
        .room-status-info .fa-users { color: #6c5ce7; } /* 그룹 채팅 아이콘 색상 */
        /* ⭐⭐ 보강 끝 ⭐⭐ */
        /* ⭐⭐ 보강: 안 읽은 메시지 뱃지 및 인원 수 표시를 위한 컨테이너 ⭐⭐ */
        .room-item-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .unread-badge {
            background-color: #e74c3c;
            color: white;
            font-size: 11px;
            font-weight: 700;
            border-radius: 40px;
            padding: 3px 8px;
            flex-shrink: 0;
            display: inline-block;
            min-width: 24px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.07);
            text-align: center;
        }
        /* ⭐⭐ 보강 끝 ⭐⭐ */

        /* ★추가: 친구 초대 버튼 스타일 개선 */
        .invite-action-btn {
            padding: 15px 25px !important; /* 내부 패딩 증가로 높이/크기 증가 */
            font-size: 16px !important; /* 폰트 크기 유지 */
            font-weight: 700 !important;
            cursor: pointer !important; /* 마우스 포인터 추가 */
            transition: background-color 0.3s, transform 0.2s;
        }
        .invite-action-btn:hover {
            transform: translateY(-1px);
            background-color: #27ae60 !important; /* hover 색상 변경 */
        }
    </style>
</head>
<body>

<header class="quick-menu">
    <div class="logo"><a href="/">Multi FC</a></div>
    <div class="header-icons">
        <button id="profile-menu-toggle" class="profile-icon" style="position: relative; display: none;">
            <i class="fas fa-user-circle"></i>
        </button>
        <div id="profile-menu" class="user-menu"></div>
        <button id="menu-toggle" class="menu-toggle-btn"><i class="fas fa-bars"></i></button>
    </div>
    <nav id="main-menu" class="main-nav">
        <ul>
            <li><a href="/"><i class="fas fa-home"></i> 메인 (Home)</a></li>
            <li><a href="/fields"><i class="fas fa-search"></i> 구장검색</a></li>
            <li><a href="/community"><i class="fas fa-users"></i> 커뮤니티</a></li>
            <li id="nav-chat-link-li"><a href="/chat" class="active"><i class="fas fa-comments"></i> 실시간채팅</a></li>
        </ul>
    </nav>
</header>

<div id="connection-status">
    WebSocket 연결 중... 서버가 준비되면 자동으로 연결됩니다.
</div>

<main id="chat-main-wrapper" class="chat-main">
    <!-- ✅ 사이드바: 채팅 목록 -->
    <div class="chat-sidebar">
        <div class="chat-header">
            채팅 목록
            <button id="new-chat-btn" onclick="openNewChatModal(true)" style="background:none; border:none; color:#6c5ce7; font-size:16px; cursor:pointer;" title="새 채팅 시작">
                <i class="fas fa-plus-circle"></i>
            </button>
        </div>

        <div id="chat-type-tabs" class="chat-type-tabs">
            <button data-type="public" class="active">전체 채팅</button>
            <button data-type="group">그룹 채팅</button>
            <button data-type="one-on-one">1:1 채팅</button>
        </div>

        <div id="room-list-container" class="room-list-container"></div>
    </div>

    <!-- ✅ 메인 채팅 영역 -->
    <div class="chat-content-area">
        <!-- 초기 안내 메시지 -->
        <div id="chat-welcome-message">
            <p>채팅 목록에서 방을 선택해주세요.</p>
        </div>

        <!-- 채팅방 활성화 시 표시 -->
        <div id="current-chat-room" style="display: none;">
            <!-- ✅ 채팅방 헤더 -->
            <div id="chat-room-header" class="chat-header">
                <div class="room-title-wrapper">
                    <span id="room-title">채팅방 제목</span>
                    <!-- ✅ 참여자 수 및 타입 아이콘 -->
                    <div id="room-status-display" class="room-status-info" style="display: none;">
                        <span id="room-type-icon"></span>
                        <span id="room-participant-count">0</span>
                    </div>
                </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<script>
    console.log('✅ 스크립트 로드 시작');
    // --- (★공통★) 메뉴 토글 및 인증 로직 ---
    const menuToggle = document.getElementById('menu-toggle');
    const mainMenu = document.getElementById('main-menu');
    const profileMenuToggle = document.getElementById('profile-menu-toggle');
    const profileMenu = document.getElementById('profile-menu');
    const logoutButton = document.getElementById('logout-button');
    const navLoginLink = document.querySelector('#main-menu a[href="/login"]');
    const navLogoutLink = document.querySelector('#main-menu ul li:last-child');
    // ... (이하 공통 로직 유지) ...

    if (menuToggle) {
        menuToggle.addEventListener('click', () => {
            mainMenu.classList.toggle('show');
            if (profileMenu) profileMenu.classList.remove('show');
        });
    }

    if (profileMenuToggle) {
        profileMenuToggle.addEventListener('click', () => {
            profileMenu.classList.toggle('show');
            if (mainMenu) mainMenu.classList.remove('show');
        });
    }
    // ... (이하 공통 로직 유지) ...


    // ===========================================
    // 챗 클라이언트 로직 (WebSocket/STOMP)
    // ===========================================

    //webSocket/Stomp
    let stompClient = null;
    let currentRoomId = null;

    //구독 관리
    let roomSubscription = null;
    let userQueueSubscription = null;

    //사용자 정보
    let myUserId = null;
    let myUsername = null;
    let currentUserId = null;
    let currentNickname = null;

    //DOM 요소
    const chatContainer = document.getElementById('chat-messages-container');
    const inputArea = document.getElementById('message-input');
    const roomTitleElement = document.getElementById('room-title');
    const connectionStatus = document.getElementById('connection-status');
    const roomListContainer = document.getElementById('room-list-container');
    const chatTypeTabs = document.getElementById('chat-type-tabs');
    const participantSidebar = document.getElementById('participant-sidebar');
    const participantListContainer = document.getElementById('participant-list-container');
    const chatMainWrapper = document.getElementById('chat-main-wrapper'); // 메인 wrapper

    //modal 요소
    const newChatModal = document.getElementById('new-chat-modal'); // 새 채팅 모달
    const inviteModal = document.getElementById('invite-modal'); // ★초대 모달
    const friendListToInvite = document.getElementById('friend-list-to-invite'); // ★초대 목록 컨테이너
    const selectedInviteCountElement = document.getElementById('selected-invite-count'); // ★선택 인원 수 표시
    let selectedInvitees = new Set(); // ★선택된 친구 Set

    // inline 프로필
    const inlineProfileDetail = document.getElementById('inline-profile-detail');
    const chatContentArea = document.getElementById('chat-content-area');
    const roomStatusDisplay = document.getElementById('room-status-display');
    const roomParticipantCount = document.getElementById('room-participant-count');
    const roomTypeIcon = document.getElementById('room-type-icon');

    // ★모달 내 입력 요소
    const newChatTypeSelect = document.getElementById('new-chat-type');
    const newChatTitleInput = document.getElementById('new-chat-title');
    const newChatRecipientInput = document.getElementById('new-chat-recipient');
    const recipientInputGroup = document.getElementById('recipient-input-group');
    const chatFormInfo = document.getElementById('chat-form-info');

    const RECONNECT_INTERVAL = 5000;
    let currentChatType = 'public'; // ★기본값 public으로 설정 (HTML 탭과 일치)

    let token = localStorage.getItem('accessToken');

    if(!token) {
        alert('로그인이 필요합니다.');
        window.location.href = "/login";
    }

    //JWT 토큰 디코딩 함수
    function parseJwt(token) {
        try {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function (c){
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        } catch (e){
            console.error('JWT 파싱 실패 :' , e);
            return null;
        }
    }

    //JWT 사용자 정보 추출
    function initUserInfo() {
        token = localStorage.getItem('accessToken');
        const payload = parseJwt(token);
        if(!payload || !payload.sub) {
            alert('유효하지 않은 토큰입니다. 다시 로그인 해주세요.');
            localStorage.removeItem('accessToken');
            window.location.href = "/login";
            return;
        }

        fetch('/api/users/me', {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        })
            .then(response => {
                if(!response.ok) throw new Error('사용자 정보 조회 실패');
                return response.json();
            })
            .then(user => {
                currentUserId = user.userId;
                currentNickname = user.nickname;
                myUserId = user.userId;
                myUsername = user.nickname;
                console.log('현재 사용자:', {userId: currentUserId,nickname:currentNickname});

                connect();

                const defaultType = 'public';
                const activeTab = document.querySelector(`[data-type="public"]`);
                if(activeTab) activeTab.classList.add('active');
                loadRoomList(defaultType);
            })
            .catch(error => {
                console.error('사용자 정보 로드 실패:', error);
                alert('사용자 정보를 불러올 수 없습니다.');
                window.location.href = "/login";
            });
    }

    //WebSocket 연결 관리
    function updateStatus(message, isError = true) {
        connectionStatus.textContent = message;
        connectionStatus.style.display = 'block';
        connectionStatus.style.backgroundColor = isError ? '#ffe3e3' : '#e6ffed';
        connectionStatus.style.color = isError ? '#c0392b' : '#28a745';

        if (!isError) {
            setTimeout(() => {
                connectionStatus.style.display = 'none';
            }, 3000);
        } else {
            connectionStatus.style.display = 'none';
            console.error("WebSocket 연결 실패. 5초 후 재시도합니다.");
        }
    }

    function connect() {
        if (stompClient && stompClient.connected) {
            console.log('이미 연결 되어있습니다');
            return;
        }

        updateStatus("WebSocket 연결 시도 중...", true);

        const socket = new SockJS('/chat');
        stompClient = Stomp.over(socket);
        stompClient.debug = null;

        const headers = token ? { 'Authorization': `Bearer ${token}`  } : {};

        stompClient.connect(headers, onConnected, onError);
    }
    function onConnected() {
        console.log('WebSocket 연결 성공.');
        updateStatus("✅ 실시간 채팅 서버에 연결되었습니다.", false);

        if (currentRoomId && !userQueueSubscription) {
            try {
                userQueueSubscription = stompClient.subscribe(`/user/queue/messages`, function (message) {
                        const receivedMessage = JSON.parse(message.body);
                        console.log('📨 개인 메시지 수신:', receivedMessage);
                        handleReceivedMessage(receivedMessage);
                    },{
                        id : `user-queue-${currentRoomId}`}
                );
                console.log('개인 메세지 큐 구독 완료');
            } catch (e) {
                console.error('개인 큐 구독 실패 :' ,e);
            }
        }
        if (currentRoomId) {
            subscribeToRoom(currentRoomId);
        }
    }

    function disconnect(){
        console.log('🔌 WebSocket 연결 종료 시작');

        if(userQueueSubscription) {
            try {
                userQueueSubscription.unsubscribe();
                console.log('✅ 개인 큐 구독 해제 완료');
            } catch (e) {
                console.warn('개인 큐 구독 해제 실패:', e);
            }
            userQueueSubscription = null;
        }

        if (roomSubscription) {
            try {
                roomSubscription.unsubscribe();
                console.log('✅ 방 구독 해제 완료');
            } catch (e) {
                console.warn('방 구독 해제 실패:', e);
            }
            roomSubscription = null;
        }

        if (stompClient && stompClient.connected) {
            stompClient.disconnect(() => {
                console.log('✅ STOMP 연결 완전 종료');
                stompClient = null;
            });
        }
    }

    function onError(error) {
        console.error('WebSocket 연결 오류: 재연결 시도', error);
        connectionStatus.style.display = 'none';

        if(userQueueSubscription) {
            userQueueSubscription = null;
        }
        if(roomSubscription) {
            roomSubscription = null;
        }
        if(stompClient){
            try {
                if (stompClient.ws && stompClient.ws.readyState === WebSocket.OPEN) {
                    stompClient.disconnect(() => {
                        stompClient = null;
                        setTimeout(connect, RECONNECT_INTERVAL);
                    });
                } else {
                    stompClient = null;
                    setTimeout(connect, RECONNECT_INTERVAL);
                }
            } catch (e) {
                console.error('연결 종료 중 오류:', e);
                stompClient = null;
                setTimeout(connect, RECONNECT_INTERVAL);
            }
        } else {
            setTimeout(connect, RECONNECT_INTERVAL);
        }
    }

    function handleReceivedMessage(receivedMessage) {
        console.log('📨 개인 메시지 수신:', receivedMessage);

        if(receivedMessage.roomId === currentRoomId) {
            displayMessage({
                sender: receivedMessage.senderId,
                senderNickname: receivedMessage.senderNickname,
                content: receivedMessage.content,
                timestamp : formatTimestamp(receivedMessage.sentAt || new Date()),
            });
        } else {
            updateUnreadCount(receivedMessage.roomId);
        }

        updateLastMessageInList(receivedMessage.roomId, receivedMessage.content, receivedMessage.senderNickname);
    }

    function updateUnreadCount(roomId) {
        if(roomId !== currentRoomId) {
            const roomItem = document.querySelector(`.room-item-[data-room-id="${roomId}"]`);
            if(roomItem){
                let badge = roomItem.querySelector('.unread-badge');

                if(!badge) {
                    const actionContainer = roomItem.querySelector(('.room-item-actions'));
                    if(actionContainer) {
                        badge = document.createElement('span');
                        badge.classList.add('unread-badge');
                        badge.textContent = '1';
                        actionContainer.insertBefore(badge, actionContainer.firstChild);
                    }
                } else {
                    const currentCount = parseInt(badge.textContent) || 0;
                    badge.textContent = currentCount + 1;
                }
            }
        }
    }

    function updateLastMessageInList(roomId, content, senderNickname) {
        const roomItem = document.querySelector(`.room-item-[data-room-id="${roomId}"]`);
        if(roomItem) {
            const roomInfo = roomItem.querySelector('.room-info');
            if(roomInfo) {
                let lastMessageDiv = roomInfo.querySelector('.last-message');
                if(!lastMessageDiv) {
                    lastMessageDiv = document.createElement('div');
                    lastMessageDiv.className = 'last-message';
                    lastMessageDiv.style.fontSize = '12px';
                    lastMessageDiv.style.color = '#999';
                    lastMessageDiv.style.marginTop = '4px';
                    lastMessageDiv.style.overflow = 'hidden';
                    lastMessageDiv.style.textOverflow = 'ellipsis';
                    lastMessageDiv.style.whiteSpace = 'nowrap';
                    roomInfo.appendChild(lastMessageDiv);
                }
                const preview = content.length > 30 ? content.substring(0, 30) + '...' : content;
                lastMessageDiv.textContent = `${senderNickname}: ${preview}`;
            }
        }
    }



    //유틸리티 함수
    async function fetchUserIdByNickname(nickname) {
        const response = await fetch(`/api/users/search?nickname=${encodeURIComponent(nickname)}`, {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });

        if(!response.ok) throw new Error(`사용자 "${nickname}"를 찾을 수 없습니다.`);

        const users = await response.json();

        const user = users[0];
        console.log(user);
        return user.userId;
    }

    async function fetchUserIdsByNicknames(nicknames) {
        const userIds = [];
        for (const nickname of nicknames) {
            try{
                userIds.push(await fetchUserIdByNickname(nickname));
            } catch(e) {
                console.error(`${nickname} 조회 실패:`,e);
            }
        }
        return userIds;
    }

    function convertToBackendRoomType(frontendType){
        const typeMap = {
            'public': null,
            'group': '그룹',
            'one-on-one':'1대1'
        };
        return typeMap[frontendType];
    }

    function convertToFrontendRoomType(backendType){
        const typeMap = {
            '그룹': 'group',
            '1대1': 'one-on-one'
        };
        return typeMap[backendType] || 'public';
    }

    //메세지 관련
    function subscribeToRoom(roomId) {
        if(roomSubscription) {
            console.log('🔄 이전 방 구독 해제:', roomSubscription.id);
            try {
                roomSubscription.unsubscribe();
            } catch (e) {
                console.warn('구독 해제 실패:', e);
            }
            roomSubscription = null;
        }

        if(stompClient && stompClient.connected) {
            try {
                roomSubscription = stompClient.subscribe(
                    `/topic/chatroom/${roomId}`,
                    onMessageReceived,
                    { id: `room-${roomId}` }
                );
                console.log(`✅ Room ${roomId} 구독 시작.`)
            } catch (e){
                console.error('방 구독 실패:', e);
            }
        } else{
            console.warn('⚠️ STOMP 연결이 없어 방 구독 실패');
        }
    }

    function onMessageReceived(payload) {
        try {
            const message = JSON.parse(payload.body);
            console.log("수신된 메세지:", message);


            displayMessage({
                sender : message.senderId,
                senderNickname : message.senderNickname,
                content : message.content,
                timestamp : formatTimestamp(message.sentAt || new Date())
            });
        } catch (e) {
            console.log('메세지 파싱 오류:',e);
        }
    }
    function formatTimestamp(sentAt) {
        return new Date(sentAt).toLocaleTimeString('ko-KR', {
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    // 메시지 전송 로직 (전송 후 화면 표시)
    function sendMessage() {
        const messageContent = inputArea.value.trim();

        if(!messageContent) return;

        if(!currentRoomId){
            alert("채팅방을 먼저 선택해주세요.");
            return;
        }

        if(!stompClient || !stompClient.connected){
            alert("❌ 채팅 서버에 연결되어 있지 않습니다. 잠시 후 재시도 해주세요.");
            return;
        }

        const chatMessage = {
            roomId: currentRoomId,
            sender: currentUserId,
            senderNickname: currentNickname,
            content: messageContent,
        };

        console.log("chatMessage :", chatMessage);

        // 1. 서버로 전송 (실시간 웹소켓)
        stompClient.send(`/app/chatroom/${currentRoomId}/send`, {}, JSON.stringify(chatMessage));

        // 2. 입력 필드 초기화
        inputArea.value = '';

        // 4. 목록의 마지막 메시지 업데이트
        updateLastMessage(currentRoomId, messageContent);

        fetch(`/chatroom/${currentRoomId}/mark-read`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            credentials: 'include'
        }).catch(e => {
            console.error('읽음 상태 갱신 실패', e);
        });
    }


    // 새로운 함수: 채팅 목록의 마지막 메시지 업데이트
    function updateLastMessage(roomId, content) {
        const roomItem = document.querySelector(`.room-item[data-room-id="${roomId}"]`);
        if (roomItem) {
            const lastMessageDiv = roomItem.querySelector('.last-message');
            if (lastMessageDiv) {
                const preview = (content.length > 30 ? content.substring(0, 30) + '...' : content);
                lastMessageDiv.textContent = `나: ${preview}`;
            }
        }
    }

    function displayMessage(message) {
        const isMine = message.sender === myUserId;

        const wrapper = document.createElement('div');
        wrapper.className = 'message-wrapper ' + (isMine ? 'mine' : 'other');

        if (!isMine) {
            const nicknameDiv = document.createElement('div');
            nicknameDiv.className = 'message-nickname';
            nicknameDiv.textContent = message.senderNickname;
            wrapper.appendChild(nicknameDiv);

    // 채팅방 목록 관리
    async function loadRoomList(type) {
        currentChatType = type;
        roomListContainer.innerHTML = '<div style="padding:20px; text-align:center; color:#999;">로딩 중...</div>';

        try {
            let rooms = [];
            const token = localStorage.getItem('accessToken');

            if (type === 'public') {
                const [oneToOneResponse, groupResponse] = await Promise.all([
                    fetch('/chatroom?type=1대1', {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    }),
                    fetch('/chatroom?type=그룹',{
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    })
                ]);

                if(!oneToOneResponse.ok || !groupResponse.ok){
                    throw new Error('채팅방 목록 조회 실패');
                }

                const oneToOneRooms = await oneToOneResponse.json();
                const groupRooms = await groupResponse.json();
                rooms = [...oneToOneRooms, ...groupRooms];
            } else {
                const backendType = convertToBackendRoomType(type);
                const response = await fetch(`/chatroom?type=${backendType}`,{
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if(!response.ok) throw new Error('채팅방 목록 조회 실패');
                rooms = await response.json();
            }

            renderRoomList(rooms);
        } catch (error) {
            console.error('채팅방 목록 로드 실패:', error);
            roomListContainer.innerHTML = '<div style="padding:20px; text-align:center; color:#e74c3c;">채팅방을 불러오지 못했습니다.</div>';
        }
    }

    // 렌더링 로직 분리
    function renderRoomList(rooms) {
        roomListContainer.innerHTML = '';

        if (rooms.length === 0) {
            roomListContainer.innerHTML = `<div style="padding: 20px; text-align: center; color: #999;">현재 ${currentChatType} 유형의 채팅방이 없습니다.</div>`;
            if (!currentRoomId || !rooms.find(room => room.roomId === currentRoomId)) {
                currentRoomId = null;
                document.getElementById('current-chat-room').style.display = 'none';
                document.getElementById('chat-welcome-message').style.display = 'flex';
                roomStatusDisplay.style.display = 'none';
            }
            return;
        }

        rooms.forEach(room => {
            const isActive = room.roomId === currentRoomId;
            const item = document.createElement('div');
            item.className = 'room-item' + (isActive ? ' active' : '');
            item.dataset.roomId = room.roomId;

            let typeIcon = '';
            if (room.roomType === '1대1') {
                typeIcon = '<i class="fas fa-user" style="color:#6c5ce7; margin-right:5px;"></i>';
            } else if (room.roomType === '그룹') {
                typeIcon = '<i class="fas fa-users" style="color:#00b894; margin-right:5px;"></i>';
            }

            // ====== 방 구조 시작 ======
            const roomInfo = document.createElement('div');
            roomInfo.className = 'room-info';

            // 제목과 뱃지 한 줄
            const titleRow = document.createElement('div');
            titleRow.style.display = 'flex';
            titleRow.style.justifyContent = 'space-between';
            titleRow.style.alignItems = 'center';

            const roomNameDiv = document.createElement('div');
            roomNameDiv.className = 'room-name';
            roomNameDiv.innerHTML = `${typeIcon}<span>${room.roomName}</span>`;

            // 뱃지(안읽은 메시지 개수)
            let badge = null;
            if (room.unreadCount && room.unreadCount > 0) {
                badge = document.createElement('span');
                badge.className = 'unread-badge';
                badge.textContent = room.unreadCount;
            }

            titleRow.appendChild(roomNameDiv);
            if (badge) titleRow.appendChild(badge);

            // 참여자 수 (아래 줄)
            const partDiv = document.createElement('div');
            partDiv.className = 'room-participants';
            partDiv.style.color = '#aaa';
            partDiv.style.fontSize = '11px';
            partDiv.style.marginTop = '2px';
            partDiv.textContent = `참여자: ${room.memberCount}명`;

            // 조립
            roomInfo.appendChild(titleRow);
            roomInfo.appendChild(partDiv);

            roomInfo.addEventListener('click', () => selectRoom(room));

            item.appendChild(roomInfo);
            roomListContainer.appendChild(item);
        });

        if (!currentRoomId) {
            document.getElementById('current-chat-room').style.display = 'none';
            document.getElementById('chat-welcome-message').style.display = 'flex';
        }
    }


    // ★새로운 함수: 채팅방 삭제 로직
    async function leaveChatRoom(roomId) {
        if(!confirm('정말로 이 채팅방을 나가시겠습니까?')){
            return;
        }

        try {
            const response = await fetch(`/chatroom/${roomId}/leave`, {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if(!response.ok) throw new Error('채팅방 나가기 실패')

            alert('채팅방을 나갔습니다.');

            if(currentRoomId === roomId){
                currentRoomId = null;
                document.getElementById('current-chat-room').style.display = 'none';
                document.getElementById('chat-welcome-message').style.display = 'flex';

                const leaveRoomBtn = document.getElementById('leave-room-btn');
                if(leaveRoomBtn){
                    leaveRoomBtn.style.display = 'none';
                }
            }
            loadRoomList(currentChatType);
        } catch (e){
            console.error('채팅방 나가기 실패:', e);
            alert('채팅방을 나가는데 실패했습니다.');
        }
    }

    async function loadRoomHistory(roomId) {
        if(chatContainer.children.length > 0){
            chatContainer.innerHTML = '';
        } else {
            chatContainer.innerHTML = '<div style="text-align:center; padding:30px; color:#999;">메시지를 불러오는 중...</div>';
        }

        try {
            const response = await fetch(`/chatroom/${roomId}/messages`,{
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });
            if(!response.ok) throw new Error('메세지 조회 실패');

            const messages = await response.json();
            chatContainer.innerHTML = '';

            messages.forEach(msg => {
                displayMessage({
                    sender : msg.senderId,
                    senderNickname : msg.senderNickname,
                    content : msg.content,
                    timestamp: formatTimestamp(msg.sentAt)
                });
            });
            chatContainer.scrollTop = chatContainer.scrollHeight;
        } catch (e) {
            console.error('메세지 로드 실패:',e);
            chatContainer.innerHTML = '<div style="text-align:center; color:#e74c3c; padding:30px;">메시지를 불러오지 못했습니다.</div>';
        }
    }

    // ⭐⭐ 보강: selectRoom 함수 (채팅방 상태 표시 업데이트) ⭐⭐
    async function selectRoom(room) {
        const activeItem = document.querySelector('.room-item.active');
        if (activeItem) {
            activeItem.classList.remove('active');
            if(participantSidebar.classList.contains('open')) {
                openParticipantList(false);
            }
        }

        // ⭐⭐⭐ 보강: 새로운 방 선택 시 인라인 프로필 창 닫기 ⭐⭐⭐
        openInlineProfileDetail(false);

        const newActiveItem = document.querySelector(`.room-item[data-room-id="${room.roomId}"]`);
        if (newActiveItem) {
            newActiveItem.classList.add('active');
            // 선택된 방의 뱃지 제거 (읽음 처리)
            const badge = newActiveItem.querySelector('.unread-badge');
            if(badge) badge.remove();
            room.unreadCount = 0;
        }

        try {
            await fetch(`/chatroom/${room.roomId}/mark-read`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                credentials: 'include'
            });
        } catch (e) {
            console.error('읽음 상태 갱신 실패:', e);
        }

        currentRoomId = room.roomId;
        document.getElementById('sidebar-room-name').textContent = room.roomName;
        roomTitleElement.textContent = room.roomName;

        const leaveRoomBtn = document.getElementById('leave-room-btn');
        if(leaveRoomBtn){
            leaveRoomBtn.style.display = 'block';
            leaveRoomBtn.onclick = () => leaveChatRoom(room.roomId);
        }

        // 채팅방 상세 상태 업데이트 (ERD: ChatRoom 반영)
        roomStatusDisplay.style.display = 'flex';
        roomParticipantCount.textContent = `${room.memberCount}명`;

        let iconClass = room.roomType === '1대1' ? 'fas fa-lock' : 'fas fa-users';
        roomTypeIcon.innerHTML = `<i class="${iconClass}"></i>`;

        document.getElementById('chat-welcome-message').style.display = 'none';
        document.getElementById('current-chat-room').style.display = 'flex';
        document.getElementById('current-chat-room').style.flexDirection = 'column';

        // ⭐⭐ 보강: 채팅 내용을 로드 ⭐⭐
        await loadRoomHistory(room.roomId);

        if (stompClient && stompClient.connected) {
            subscribeToRoom(room.roomId);
        } else {
            connect();
        }
    }

        const isOpen = typeof shouldOpen === 'boolean' ? shouldOpen : !participantSidebar.classList.contains('open');

            loadParticipantList(currentRoomId);

            chatMainWrapper.classList.add('sidebar-open');

        } else {
            participantSidebar.classList.remove('open');
            chatMainWrapper.classList.remove('sidebar-open');
        }
    }

    // ★수정된 함수: 채팅방 생성 (카테고리별)
    async function createNewChat() {
        const type = newChatTypeSelect.value;
        const title = newChatTitleInput.value.trim();
        const recipientInput = newChatRecipientInput.value.trim();
        const maxParticipantsInput = document.getElementById('new-chat-max-participants'); // 추가된 변수
        const maxParticipants = parseInt(maxParticipantsInput.value);
        const createBtn = document.querySelector('.btn-create');
        createBtn.disabled = true;

        if (!title) {
            alert("채팅방 제목을 입력해주세요.");
            return;
        }

        try {
            //const token = localStorage.getItem('accessToken');
            let apiUrl = '';
            let requestOptions = {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            };

            if (type === 'one-on-one') {
                if (!recipientInput) {
                    alert("1:1 채팅은 상대방 닉네임이 필수입니다.");
                    createBtn.disabled = false;
                    return;
                }
                const targetUserId = await fetchUserIdByNickname(recipientInput);
                apiUrl = `/chatroom/onetoone?targetUserId=${targetUserId}`;
                console.log(apiUrl);
            } else {
                const invitedNicknames = recipientInput ? recipientInput.split(',').map(n => n.trim()) : [];
                let invitedUserIds = invitedNicknames.length > 0 ? await fetchUserIdsByNicknames(invitedNicknames) : [];

                invitedUserIds = invitedUserIds.filter(id => id !== myUserId);
                console.log('초대할 사용자 (본인 제외):', invitedUserIds);

                apiUrl = '/chatroom/group';

                requestOptions.headers['Content-Type'] = 'application/json';
                requestOptions.body = JSON.stringify({
                    roomType: '그룹',
                    roomName: title,
                    invitedUserIds: invitedUserIds,
                    maxParticipants: maxParticipants || 10
                });
            }
            const response = await fetch(apiUrl, requestOptions);

            if (!response.ok) {
                const errorText = await response.text();
                console.error('응답 에러:', errorText);
                throw new Error('채팅방 생성 실패');
            }

            const newRoom = await response.json();

            openNewChatModal(false);

            // 탭 전환
            chatTypeTabs.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
            const newTab = document.querySelector(`[data-type="${type}"]`);
            if (newTab) newTab.classList.add('active');

            loadRoomList(type); // 목록 갱신
            setTimeout(()=>selectRoom(newRoom),500); // 새 방으로 이동
        } catch (e) {
            console.error('채팅방 생성 실패'+e);
            alert('채팅방 생성에 실패했습니다:' + e.message);
        } finally {
            createBtn.disabled = false;
        }
    }

        }
        friendListToInvite.innerHTML = '<div style="padding:20px; text-align:center; color:#999;">로딩 중...</div>';

                    }
                }),

                })
            ]);
            if(!friendsResponse.ok) throw new Error('친구 목록 조회 실패');
            if (!participantsResponse.ok) throw new Error('참여자 조회 실패');

            const friends = await friendsResponse.json();
            const participants = await participantsResponse.json();
            const participantUserIds = new Set(participants.map(p => p.userId));

            const availableFriends = friends.filter(f => !participantUserIds.has(f.userId));
            friendListToInvite.innerHTML = '';

            if (availableFriends.length === 0) {
                friendListToInvite.innerHTML = '<p style="text-align:center; padding:20px; color:#999;">초대 가능한 친구가 없습니다.</p>';
                selectedInviteCountElement.textContent = 0;
                return;
            }

            availableFriends.forEach(friend => {
                const item = document.createElement('div');
                item.className = 'invite-friend-item';
                item.innerHTML = `
                <input type="checkbox" class="friend-checkbox" value="${friend.userId}">
                <span>${friend.nickname}</span>`;
                friendListToInvite.appendChild(item);
            });

            function updateSelectedInviteCount() {
                const checkedCount = document.querySelectorAll('.friend-checkbox:checked').length;
                selectedInviteCountElement.textContent = checkedCount;
            }
            const checkboxes = friendListToInvite.querySelectorAll('.friend-checkbox');
            checkboxes.forEach(checkbox => checkbox.addEventListener('change', updateSelectedInviteCount));

            updateSelectedInviteCount();
        } catch (e) {
            console.error('친구 목록 로드 실패:', e);
            friendListToInvite.innerHTML = '<p style="text-align:center; padding:20px; color:#e74c3c;">친구 목록을 불러올 수 없습니다.</p>';
            selectedInviteCountElement.textContent = 0;
        }
    }

    /**
     * 최종 초대 전송
     */
    async function sendInvite() {
        const checkboxes = document.querySelectorAll('.friend-checkbox:checked');
        const invitedUserIds = Array.from(checkboxes).map(c => parseInt(c.value));

        if(invitedUserIds.length === 0) {
            alert('초대할 친구를 선택해주세요.');
            return;
        }

        try {
            console.log("초대한 사용자 리스트",invitedUserIds);
            const response = await fetch(`/chatroom/${currentRoomId}/invite`,{
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                },
                body: JSON.stringify(invitedUserIds),
                credentials: 'include'
            });

            if(!response.ok) throw new Error('초대 실패');

            alert('초대 메세지를 성공적으로 보냈습니다.');
            openInviteModal(false);
            loadParticipantList(currentRoomId);
            loadRoomList(currentChatType);
        } catch (e) {
            console.error('초대 실패:', e);
            alert('초대에 실패했습니다.');
        }
    }
    // ===========================================
    // ★기타 이벤트 리스너 (기존 로직 유지)
    // ===========================================

    document.getElementById('room-list-container').addEventListener('click', (e) => {
        // 삭제 버튼 클릭은 여기서 처리하지 않고, deleteChatRoom에서 처리됨
    });

    chatTypeTabs.addEventListener('click', (e) => {
        const button = e.target.closest('button');
        if (button) {
            chatTypeTabs.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');

            const newType = button.dataset.type;
            loadRoomList(newType);
        }
    });

    // ⭐⭐ 인라인 프로필 액션 버튼 핸들러 연결 ⭐⭐
    document.addEventListener('DOMContentLoaded', () => {
        console.log('✅ DOMContentLoaded 실행됨');
        // ✅ 인라인 프로필 초기 숨김
        if (inlineProfileDetail) {
            inlineProfileDetail.style.display = 'none';
        }

        // ✅ 비회원 접근 제어
        const accessToken = localStorage.getItem('accessToken');
        if (!accessToken) {
            alert("❌ 실시간 채팅은 회원만 이용할 수 있습니다.");
            window.location.href = '/login';
            return;
        }

        initUserInfo();

        if(chatTypeTabs){
            chatTypeTabs.addEventListener('click', (e) => {
                const button = e.target.closest('button');
                if(button){
                    chatTypeTabs.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                }
                const newType = button.dataset.type;
                loadRoomList(newType);
            });
        }

        const profileChatBtn = document.getElementById('profile-chat-btn');
        const profileFriendBtn = document.getElementById('profile-friend-btn');

        if(profileChatBtn){
            profileChatBtn.addEventListener('click', async function(){
                const targetUserId = inlineProfileDetail.dataset.userId;
                if(!targetUserId){
                    alert('사용자 정보를 불러올 수 없습니다.');
                    return;
                }
                try {
                    const response = await fetch(`/chatroom/onetoone?targetUserId=${targetUserId}`,{
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    if(!response.ok) throw new Error('1:1 채팅방 생성 실패');

                    const chatRoom = await response.json();
                    openInlineProfileDetail(false);

                    chatTypeTabs.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
                    const oneToOneTab = document.querySelector(`[data-type="one-on-one"]`);
                    if(oneToOneTab) oneToOneTab.classList.add('active');

                    await loadRoomList('one-on-one');
                    setTimeout(() => selectRoom(chatRoom), 300);
                } catch (e) {
                    console.error('1:1 채팅 시작 실패:', e);
                    alert('1:1 채팅을 시작할 수 없습니다.');
                }
            });
        }
        if (profileFriendBtn) {
            profileFriendBtn.addEventListener('click', async function() {
                const targetUserId = inlineProfileDetail.dataset.userId;
                if (!targetUserId) {
                    alert('사용자 정보를 불러올 수 없습니다.');
                    return;
                }

                try {
                    const response = await fetch(`/api/friends/request/${targetUserId}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ targetUserId: targetUserId })
                    });

                    if (!response.ok) throw new Error('친구요청 실패');

                    alert('친구 요청을 보냈습니다.');
                    openInlineProfileDetail(false);
                } catch (e) {
                    console.error('친구 요청 실패:', e);
                    alert('친구 요청을 보낼 수 없습니다.');
                }
            });
        }
    });
    const messageInput = document.getElementById('message-input');
    if (messageInput) {
        messageInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });
    }

    window.addEventListener('beforeunload', () => {
        console.log('🔄 페이지 언로드, WebSocket 정리');
        disconnect();
    })
</script>
</body>
</html>

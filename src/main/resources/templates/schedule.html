<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MULTI FC - 일정 검색</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

</head>
<body>

<header class="quick-menu">
    <div class="logo"><a href="/">Multi FC</a></div>
    <div class="header-icons">
        <button id="profile-menu-toggle" class="profile-icon" style="position: relative; display: none;">
            <i class="fas fa-user-circle"></i>
            <span id="notification-badge" class="notification-badge"></span>
        </button>
        <div id="profile-menu" class="user-menu">
            <div class="user-info">
                <strong><span id="user-menu-username">사용자</span>님</strong>
                <p>환영합니다!</p>
            </div>
            <ul>
                <li><a href="/notifications" id="nav-notifications-link"><i class="fas fa-bell"></i> 알림 목록</a></li>
                <li><a href="/mypage"><i class="fas fa-user"></i> 마이페이지</a></li>
                <li><a href="/profile/edit"><i class="fas fa-user-edit"></i> 프로필 수정</a></li>
                <li><a href="#" id="logout-button"><i class="fas fa-sign-out-alt"></i> 로그아웃</a></li>
            </ul>
        </div>
        <button id="menu-toggle" class="menu-toggle-btn"><i class="fas fa-bars"></i></button>
    </div>
    <nav id="main-menu" class="main-nav">
        <ul>
            <li><a href="/"><i class="fas fa-home"></i> 메인 (Home)</a></li>
            <li><a href="/fields"><i class="fas fa-search"></i> 구장검색</a></li>
            <li><a href="/community"><i class="fas fa-users"></i> 커뮤니티</a></li>
            <li id="nav-chat-link-li"><a href="/chat" id="nav-chat-link"><i class="fas fa-comments"></i> 실시간채팅</a></li>
            <li><a href="/schedule?stadium" class="active"><i class="fas fa-calendar-alt"></i> 경기 일정</a></li>

        </ul>
    </nav>
</header>

<main class="schedule-search-main">
    <div class="search-container">
        <h1 class="search-title">📅 경기일정 검색 (내가 참가한 경기)</h1>

        <div class="filter-section">
            <div class="date-range">
                <label class="date-field">
                    <span class="date-label"><i class="fas fa-calendar-day"></i> 시작일</span>
                    <input type="date" id="filter-from">
                </label>

                <span class="range-separator">~</span>

                <label class="date-field">
                    <span class="date-label"><i class="fas fa-calendar-check"></i> 종료일</span>
                    <input type="date" id="filter-to">
                </label>
            </div>

            <select id="filter-status">
                <option value="">상태 (전체)</option>
                <option value="open">모집중</option>
                <option value="closed">모집완료</option>
            </select>

            <select id="filter-sort">
                <option value="asc">날짜 오름차순</option>
                <option value="desc">날짜 내림차순</option>
            </select>

            <button id="search-btn" class="search-btn">
                <i class="fas fa-search"></i> 검색
            </button>
        </div>

        <div class="match-list-container" id="match-list-container"></div>

        <p id="no-results-message"
           style="color:#666; text-align:center; margin-top:30px; display:none;">
            검색 결과가 없습니다.
        </p>
    </div>
</main>
<script>
    // --- (★공통★) 메뉴 토글 로직 (유지) ---
    const menuToggle = document.getElementById('menu-toggle');
    const mainMenu = document.getElementById('main-menu');
    const profileMenuToggle = document.getElementById('profile-menu-toggle');
    const profileMenu = document.getElementById('profile-menu');
    const logoutButton = document.getElementById('logout-button');
    const navNotificationsLink = document.getElementById('nav-notifications-link');
    const navChatLinkElement = document.getElementById('nav-chat-link-li');
    const navLoginLink = document.getElementById('nav-login-link');
    const navLogoutLink = document.getElementById('nav-logout-link');

    if (menuToggle) {
        menuToggle.addEventListener('click', () => {
            mainMenu.classList.toggle('show');
            profileMenu.classList.remove('show');
        });
    }
    if (profileMenuToggle) {
        profileMenuToggle.addEventListener('click', () => {
            profileMenu.classList.toggle('show');
            mainMenu.classList.remove('show');
        });
    }
    document.addEventListener('click', (event) => {
        if (!mainMenu.contains(event.target) && !menuToggle.contains(event.target) &&
            !profileMenu.contains(event.target) && !profileMenuToggle.contains(event.target)) {
            mainMenu.classList.remove('show');
            profileMenu.classList.remove('show');
        }
    });
    if (logoutButton) {
        logoutButton.addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('accessToken');
            localStorage.removeItem('hasReadReviews');
            localStorage.removeItem('hasReadSchedules');
            window.location.href = '/login';
        });
    }
    if (navNotificationsLink) {
        navNotificationsLink.addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.setItem('hasReadReviews', 'true');
            localStorage.setItem('hasReadSchedules', 'true');
            window.location.href = '/notifications';
        });
    }
    if (navLogoutLink) {
        navLogoutLink.addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('accessToken');
            localStorage.removeItem('hasReadReviews');
            localStorage.removeItem('hasReadSchedules');
            window.location.href = '/login';
        });
    }
    // --- (★공통★) 메뉴 토글 로직 끝 ---


    const badge = document.getElementById('notification-badge');
    let hasReviewNotif = false;
    let hasScheduleNotif = false;

    function updateGlobalBadge() {
        if (hasReviewNotif || hasScheduleNotif) {
            if (badge) badge.style.display = 'block';
        } else {
            if (badge) badge.style.display = 'none';
        }
    }

    async function checkPendingReviews() {
        if (localStorage.getItem('hasReadReviews') === 'true') {
            hasReviewNotif = false;
            return;
        }
        try {
            await new Promise(r => setTimeout(r, 200));
            const mockReviews = { "count": 1 };
            if (mockReviews.count > 0) hasReviewNotif = true;
        } catch (error) {
            console.error("후기 알림 요청 중 오류:", error);
        }
    }

    async function checkUpcomingSchedules() {
        if (localStorage.getItem('hasReadSchedules') === 'true') {
            hasScheduleNotif = false;
            return;
        }
        try {
            await new Promise(r => setTimeout(r, 500));
            const mockSchedules = [{ id: 1, date: "2025-11-01" }];
            if (mockSchedules.length > 0) hasScheduleNotif = true;
        } catch (error) {
            console.error("일정 요청 중 오류 발생:", error);
        }
    }

    let allMySchedules = [];
    let currentUserId = null;
    let currentUserName = null;

    function renderMatchList(matches) {
        const listContainer = document.getElementById('match-list-container');
        const noResults = document.getElementById('no-results-message');
        listContainer.innerHTML = '';

        if (matches.length === 0) {
            noResults.style.display = 'block';
            return;
        }
        noResults.style.display = 'none';

        matches.forEach(match => {
            const card = document.createElement('div');
            const statusClass = match.status === 'closed' ? 'closed' : 'open';
            const buttonDisabled = match.status === 'closed' ? 'disabled' : '';

            card.className = `match-item-card ${statusClass}`;
            card.dataset.matchId = match.id;

            const isHost = match.creator === currentUserName;
            const creatorDisplay = isHost ? '나 (Host)' : match.creator;

            card.innerHTML = `
                <div class="match-item-header">
                    <span class="date">${match.date}</span>
                </div>
                <div class="match-item-body">
                    <p style="font-size: 14px; color: #6c5ce7; font-weight: 600; margin-bottom: 12px;">
                        <i class="fas fa-crown" style="margin-right: 5px;"></i> 생성자: ${creatorDisplay}
                    </p>
                    <p class="location">
                        <i class="fas fa-map-marker-alt"></i>
                        ${match.stadiumName} (${match.location})
                    </p>
                    <p class="status">
                        <i class="fas fa-users"></i>
                        <span class="status-badge ${statusClass}">
                            ${match.status === 'open' ? '모집중' : '모집완료'}
                        </span>
                        ( ${match.current} / ${match.max}명 )
                    </p>
                    <a href="/schedule/detail/${match.id}"
                       class="details-button ${buttonDisabled}"
                       ${buttonDisabled ? 'onclick="return false;"' : ''}>
                        ${match.status === 'closed' ? '마감 (상세보기)' : '상세보기'}
                    </a>
                </div>
            `;
            listContainer.appendChild(card);
        });
    }

    async function fetchMySchedules() {
        const userId = localStorage.getItem('userId');
        const userName = localStorage.getItem('userNickname');

        if (!userId) {
            console.error("User ID not found in localStorage.");
            return [];
        }
        currentUserId = Number(userId);
        currentUserName = userName;

        try {
            const response = await fetch(`/api/matchrooms/my-schedules?userId=${userId}`);

            if (!response.ok) {
                console.error("Failed to fetch schedules:", response.statusText);
                document.getElementById('match-list-container').innerHTML =
                    `<p style="color:red; text-align:center;">
                        경기 목록을 불러오는 중 오류가 발생했습니다. (API ${response.status})
                     </p>`;
                return [];
            }

            const rawMatches = await response.json();

            allMySchedules = rawMatches.map(match => ({
                id: match.roomId,
                matchDateISO: match.matchDate,  // ✅ 날짜 필터 기준
                date: `${match.matchDate} (${match.matchTime})`,
                location: match.stadiumAddress || '주소 정보 없음',
                stadiumName: match.stadiumName || '구장 정보 없음',
                creator: match.hostNickname || ('Host ID: ' + match.hostId),
                current: match.currentPlayers || 0,
                max: match.maxPlayers,
                status: match.status.toLowerCase() === 'closed' ? 'closed' : 'open',
            }));

            return allMySchedules;

        } catch (error) {
            console.error("API call error:", error);
            document.getElementById('match-list-container').innerHTML =
                `<p style="color:red; text-align:center;">네트워크 연결 중 오류 발생.</p>`;
            return [];
        }
    }

    function performSearch() {
        const fromValue = document.getElementById('filter-from').value;
        const toValue = document.getElementById('filter-to').value;

        const fromDate = fromValue ? new Date(fromValue) : null;
        const toDate = toValue ? new Date(toValue) : null;

        // ✅ 시작일이 종료일보다 늦으면 막기
        if (fromDate && toDate && fromDate > toDate) {
            alert("시작일은 종료일보다 늦을 수 없습니다!");
            return;
        }

        const status = document.getElementById('filter-status').value;
        const sort = document.getElementById('filter-sort').value;

        let filtered = [...allMySchedules];

        // 기간 필터
        if (fromDate || toDate) {
            filtered = filtered.filter(match => {
                const d = new Date(match.matchDateISO);
                if (fromDate && d < fromDate) return false;
                if (toDate && d > toDate) return false;
                return true;
            });
        }

        // 상태 필터
        if (status) filtered = filtered.filter(match => match.status === status);

        // 정렬
        filtered.sort((a, b) => {
            const da = new Date(a.matchDateISO);
            const db = new Date(b.matchDateISO);
            return sort === "asc" ? da - db : db - da;
        });

        renderMatchList(filtered);
    }

    // --- 페이지 초기 실행 ---
    document.addEventListener('DOMContentLoaded', async () => {
        const accessToken = localStorage.getItem('accessToken');
        const currentPath = window.location.pathname;

        // ✅ 로그인 체크
        if (!accessToken) {
            alert("❌ 회원 전용 페이지입니다.\n로그인 후에 이용하실 수 있습니다.");
            localStorage.setItem('redirectAfterLogin', currentPath);
            window.location.href = '/login';
            return;
        }

        // ✅ 프로필 메뉴 닉네임 표시
        const nickname = localStorage.getItem('userNickname');
        const userMenuNameEl = document.getElementById('user-menu-username');
        if (userMenuNameEl) userMenuNameEl.textContent = nickname || "사용자";

        // ✅ 메뉴 상태
        if (profileMenuToggle) profileMenuToggle.style.display = 'block';
        if (navLoginLink) navLoginLink.parentElement.style.display = 'none';
        if (navLogoutLink) navLogoutLink.parentElement.style.display = 'list-item';

        await checkPendingReviews();
        await checkUpcomingSchedules();
        updateGlobalBadge();

        // ✅ 날짜 input 기본값 세팅 (from/to)
        const fromInput = document.getElementById('filter-from');
        const toInput = document.getElementById('filter-to');
        const today = new Date();

        if (toInput) toInput.valueAsDate = today;

// (선택) 시작일을 한달 전으로 기본 세팅
        if (fromInput) {
            const oneMonthAgo = new Date(today);
            oneMonthAgo.setMonth(today.getMonth() - 1);
            fromInput.valueAsDate = oneMonthAgo;
        }


        // ✅ 데이터 로드 후 초기 검색 실행
        await fetchMySchedules();
        performSearch();

        // ✅ 검색 버튼
        const searchBtn = document.getElementById('search-btn');
        if (searchBtn) searchBtn.addEventListener('click', performSearch);
    });
</script>
</body>
</html>
